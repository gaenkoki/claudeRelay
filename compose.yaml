services:
  claude-relay:
    build:
      context: .
    image: ${CLAUDE_RELAY_IMAGE:-claude-relay:local}
    restart: unless-stopped
    init: true
    environment:
      CLAUDE_RELAY_API_KEY: ${CLAUDE_RELAY_API_KEY:?set CLAUDE_RELAY_API_KEY in .env}
      CLAUDE_RELAY_EXPERIMENTAL_API_KEY: ${CLAUDE_RELAY_EXPERIMENTAL_API_KEY:-}
      CLAUDE_RELAY_OFFICIAL_API_KEY: ${CLAUDE_RELAY_OFFICIAL_API_KEY:-}
      CLAUDE_RELAY_ADMIN_API_KEY: ${CLAUDE_RELAY_ADMIN_API_KEY:?set CLAUDE_RELAY_ADMIN_API_KEY in .env}
      CLAUDE_RELAY_AVAILABILITY_API_KEY: ${CLAUDE_RELAY_AVAILABILITY_API_KEY:-}
      CLAUDE_RELAY_DISABLE_UPSTREAM_COMPRESSION: ${CLAUDE_RELAY_DISABLE_UPSTREAM_COMPRESSION:-false}
      CLAUDE_RELAY_UPSTREAM_PROXY: ${CLAUDE_RELAY_UPSTREAM_PROXY:-}
      CLAUDE_RELAY_MAX_REQUEST_BYTES: ${CLAUDE_RELAY_MAX_REQUEST_BYTES:-33554432}
      CLAUDE_RELAY_MAX_INFLIGHT_PER_ACCOUNT: ${CLAUDE_RELAY_MAX_INFLIGHT_PER_ACCOUNT:-3}
      CLAUDE_RELAY_MAX_COUNT_TOKENS_INFLIGHT_PER_ACCOUNT: ${CLAUDE_RELAY_MAX_COUNT_TOKENS_INFLIGHT_PER_ACCOUNT:-32}
      CLAUDE_RELAY_MAX_ACTIVE_SESSIONS_PER_ACCOUNT: ${CLAUDE_RELAY_MAX_ACTIVE_SESSIONS_PER_ACCOUNT:-5}
      CLAUDE_RELAY_AUTO_REFRESH_ENABLED: ${CLAUDE_RELAY_AUTO_REFRESH_ENABLED:-true}
      CLAUDE_RELAY_REQUEST_LOG_SIZE: ${CLAUDE_RELAY_REQUEST_LOG_SIZE:-500}
    ports:
      - "${CLAUDE_RELAY_BIND_ADDRESS:-127.0.0.1}:8567:8567"
    volumes:
      - claude-relay-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  claude-relay-data:
    name: claude-relay-data
